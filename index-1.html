<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BOYS vs GIRLS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
.board{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:10px}
.card{width:min(920px,100%);border-radius:28px;padding:18px 22px;background:rgba(10,10,16,.88);color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.title{text-align:center;font-size:clamp(20px,4.5vw,38px);font-weight:900;margin-bottom:12px}
.scores{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.team{text-align:center;padding:12px;border-radius:20px;background:rgba(255,255,255,.08)}
.name{font-size:clamp(15px,3vw,25px);font-weight:800}
.score{font-size:clamp(42px,11vw,90px);line-height:1;font-weight:900;margin-top:5px}
.vs{font-size:clamp(18px,4vw,32px);font-weight:900;opacity:.75}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.14);margin-top:14px;overflow:hidden;display:flex}
.boysbar{width:50%}.girlsbar{width:50%}
.hint{text-align:center;font-size:11px;opacity:.55;margin-top:10px}
</style>
</head>
<body>
<div class="board">
  <div class="card">
    <div class="title">🔥 BOYS vs GIRLS 🔥</div>
    <div class="scores">
      <div class="team">
        <div class="name">🔵 BOYS</div>
        <div class="score" id="boys">0</div>
      </div>
      <div class="vs">VS</div>
      <div class="team">
        <div class="name">🩷 GIRLS</div>
        <div class="score" id="girls">0</div>
      </div>
    </div>
    <div class="bar">
      <div class="boysbar" id="boysbar"></div>
      <div class="girlsbar" id="girlsbar"></div>
    </div>
    <div class="hint">🌹 Rose = BOYS &nbsp; • &nbsp; 🍩 Donut = GIRLS</div>
  </div>
</div>
<script>
const p=new URLSearchParams(location.search);
let boys=Number(p.get('boys')||0);
let girls=Number(p.get('girls')||0);
function render(){
 document.getElementById('boys').textContent=boys;
 document.getElementById('girls').textContent=girls;
 const total=Math.max(1,boys+girls);
 document.getElementById('boysbar').style.width=(boys/total*100)+'%';
 document.getElementById('girlsbar').style.width=(girls/total*100)+'%';
}
render();
</script>
</body>
</html>
