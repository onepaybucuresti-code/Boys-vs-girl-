<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOYS vs GIRLS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
.wrap{position:fixed;left:50%;top:5%;transform:translateX(-50%);width:min(92vw,700px);display:flex;flex-direction:column;gap:10px}
.title{font-weight:900;font-size:clamp(20px,5vw,42px);text-align:center;color:#fff;text-shadow:0 2px 8px #000}
.board{display:flex;gap:10px}
.team{flex:1;border-radius:18px;padding:12px 10px;text-align:center;background:rgba(0,0,0,.55);box-shadow:0 4px 18px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25)}
.name{font-size:clamp(16px,4vw,28px);font-weight:900;color:#fff}
.score{font-size:clamp(42px,12vw,92px);font-weight:900;color:#fff;line-height:1}
.hint{text-align:center;color:#fff;font-size:clamp(12px,3vw,18px);font-weight:700;text-shadow:0 2px 5px #000}
.status{text-align:center;color:#fff;font-size:12px;text-shadow:0 2px 5px #000;opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">BOYS vs GIRLS</div>
  <div class="board">
    <div class="team"><div class="name">🔵 BOYS</div><div class="score" id="boys">0</div></div>
    <div class="team"><div class="name">🩷 GIRLS</div><div class="score" id="girls">0</div></div>
  </div>
  <div class="hint">🌹 Rose = BOYS • 🍩 Donut = GIRLS</div>
  <div class="status" id="status">Conectare la scor...</div>
</div>
<script>
const p=new URLSearchParams(location.search);
let boys=Number(p.get("boys")||0), girls=Number(p.get("girls")||0);
const be=document.getElementById("boys"), ge=document.getElementById("girls"), se=document.getElementById("status");
function render(){be.textContent=boys;ge.textContent=girls} render();
const proto=location.protocol==="https:"?"wss":"ws";
const ws=new WebSocket(`${proto}://${location.host}`);
ws.onopen=()=>{se.textContent="LIVE • scor automat";setInterval(()=>{if(ws.readyState===1)ws.send("ping")},30000)};
ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==="score"){boys=Number(d.boys);girls=Number(d.girls);render()}};
ws.onclose=()=>se.textContent="Reconectare...";
</script>
</body>
</html>
